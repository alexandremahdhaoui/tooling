name: parallel-builder
kind: mcp-server
profile: builder
version: 0.15.0
description: Parallel builder that runs multiple sub-builders concurrently
openapi:
  specPath: ./spec.openapi.yaml
generate:
  packageName: main

# What this engine can build for. Generated into its build and
# config-validate tools; a platform outside it is refused before the
# engine runs.
capabilities:
  platforms: any
  frozen: true
