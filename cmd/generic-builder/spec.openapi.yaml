openapi: 3.0.3
info:
  title: generic-builder Spec Schema
  version: 0.15.0
  description: >
    Schema for the generic-builder engine spec.
    The generic-builder executes arbitrary commands as build steps, once per
    platform the entry declares. The command finds FORGE_PLATFORM, FORGE_OS,
    FORGE_ARCH, FORGE_FROZEN (the repo's frozen setting) and FORGE_OUT (where
    to write: dest/<name> for the host, dest/<name>_<os>_<arch> for a cross
    build) in its environment; a file left at FORGE_OUT is recorded as a
    binary for that platform.
components:
  schemas:
    Spec:
      type: object
      description: Configuration for generic-builder engine
      properties:
        command:
          type: string
          description: Command to execute (required)
        args:
          type: array
          items:
            type: string
          description: Command arguments (optional)
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables (optional)
        context:
          type: string
          description: Context directory for command execution (optional)
        envFile:
          type: string
          description: Path to environment file (optional)
      required:
        - command
