openapi: 3.0.3
info:
  title: testenv-lcr Spec Schema
  version: 0.15.0
  description: Configuration schema for testenv-lcr test environment subengine

components:
  schemas:
    Spec:
      type: object
      description: Configuration for testenv-lcr. Controls local container registry behavior.
      properties:
        enabled:
          type: boolean
          description: Whether the local container registry is enabled
        namespace:
          type: string
          description: Kubernetes namespace for the registry deployment
        imagePullSecretNamespaces:
          type: array
          items:
            type: string
          description: List of namespaces to create image pull secrets in
        imagePullSecretName:
          type: string
          description: Name of the image pull secret to create
        images:
          type: array
          description: >-
            Images to push into the registry once it is up. A local:// name is
            an image the build stage produced on this machine; anything else
            is pulled from its registry, with basicAuth when it is private.
          items:
            $ref: '#/components/schemas/ImageSource'
    ImageSource:
      type: object
      description: One image to push into the registry.
      required: [name]
      properties:
        name:
          type: string
          description: Image reference, local://name:tag or registry/path:tag
        basicAuth:
          $ref: '#/components/schemas/BasicAuth'
    BasicAuth:
      type: object
      description: Credentials for pulling a private image.
      required: [username, password]
      properties:
        username:
          $ref: '#/components/schemas/ValueFrom'
        password:
          $ref: '#/components/schemas/ValueFrom'
    ValueFrom:
      type: object
      description: Where a credential value comes from, exactly one of the two.
      properties:
        envName:
          type: string
          description: Read the value from this environment variable
        literal:
          type: string
          description: The value itself
