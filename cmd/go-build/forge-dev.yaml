name: go-build
kind: builder
version: 0.15.0
description: Build Go binaries with git versioning
openapi:
  specPath: ./spec.openapi.yaml
generate:
  packageName: main

# What this engine can build for. Generated into its build and
# config-validate tools; a platform outside it is refused before the
# engine runs.
capabilities:
  platforms: any
  frozen: true
  # A compiler is the one thing forge may skip: its inputs are the files a
  # detector walked, and nothing else decides its output. Every generator
  # declares nothing here and runs every time.
  incremental: true
