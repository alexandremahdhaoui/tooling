name: container-build-simple
kind: mcp-server
profile: builder
version: 0.1.0
description: >-
  Assemble a container image from prebuilt files and a base, with no daemon,
  no Containerfile and no shellout
openapi:
  specPath: ./spec.openapi.yaml
generate:
  packageName: main

# What this engine can build for. Generated into its build and
# config-validate tools; a platform outside it is refused before the
# engine runs.
capabilities:
  platforms: any
