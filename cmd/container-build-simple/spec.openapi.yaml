openapi: 3.0.3
info:
  title: container-build-simple Spec Schema
  version: 0.1.0
  description: >
    Schema for the container-build-simple engine spec.

    This engine appends ONE layer of prebuilt files onto a base image and
    writes a multi-architecture OCI image layout to disk. It is layer
    assembly rather than a build: there are no RUN steps, so it needs no
    daemon, no Containerfile and no shellout, and multi-architecture costs
    one layer set per architecture plus an index.

    It names no registry and pushes nothing. A build writes a file and a
    release publishes it, exactly as a binary does, so this engine holds no
    credential and cannot reach the outside world.

    An image that needs RUN steps is a different job and belongs to a
    Containerfile builder.
components:
  schemas:
    Spec:
      type: object
      description: Configuration for the container-build-simple engine
      required: [from]
      properties:
        base:
          type: string
          default: debian:stable-slim
          description: >
            The base image. Use "scratch" for none.

            A static binary runs on scratch, so the base exists for whatever
            else runs alongside it. For a CI job container that is a shell
            and glibc, which is why the default is a debian and not an
            alpine: musl breaks JavaScript actions in edge cases, and every
            "uses:" step in a workflow is a JavaScript action.
        from:
          type: array
          items:
            type: string
          description: >
            What goes into the layer, relative to the repository. Two shapes,
            told apart by what is on disk:

            A directory holding a forge.yaml contributes that repository's
            built binaries by RECORD: every artifact of type binary its
            artifact store carries for one of the platforms this entry
            declares, each landing on its own platform under the artifact's
            name. Nothing is parsed out of a file name.

            Anything else is a glob of files that land on every platform,
            because a script or a certificate is the same on all of them. A
            glob that matches nothing fails the build, because an image that
            silently ships empty fails on the runner that tries to use it,
            days later and far from the cause.

            The platforms assembled are the build entry's own platforms:
            declaration, and each becomes one manifest in the index.
        binDir:
          type: string
          default: /usr/local/bin
          description: Where the files land inside the image, and the front of PATH.
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables to set in the image config.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Labels to set in the image config.
