name: forge

# -- envFile is the path to a global environment file to source before any operations
envFile: .envrc

# -- artifactStorePath is the path to the unified artifact store (moved to root level)
artifactStorePath: .forge/artifact-store.yaml

# -- engines defines custom engine configurations with aliases
#
# Parallel Engines Documentation:
#
# forge://parallel-builder - Runs multiple builders in parallel
# Example usage in build section:
#   - name: all-binaries
#     engine: forge://parallel-builder
#     spec:
#       builders:
#         - name: forge-cli
#           engine: forge://go-build
#           spec:
#             src: ./cmd/forge
#             dest: ./build/bin
#         - name: go-test-runner
#           engine: forge://go-build
#           spec:
#             src: ./cmd/go-test
#             dest: ./build/bin
#
# forge://parallel-test-runner - Runs multiple test runners in parallel
# Example usage in test section:
#   - name: unit-and-lint
#     runner: forge://parallel-test-runner
#     spec:
#       primaryCoverageRunner: go-test  # Coverage is taken from this runner only
#       runners:
#         - name: go-test
#           engine: forge://go-test
#           spec:
#             packages: ./pkg/...
#         - name: go-lint-licenses
#           engine: forge://go-lint-licenses
#           spec: {}
#
# Key notes:
# - All sub-engines must use forge:// URIs (not alias://)
# - Coverage is NOT averaged - it comes from primaryCoverageRunner only
# - TestStats are summed from all runners
# - If any runner fails, the overall status is "failed"
# - All results are collected (no fail-fast behavior)
#
engines:
  # Example: custom test runner alias
  # - alias: verify-tags-runner
  #   type: test-runner
  #   testRunner:
  #     - engine: forge://generic-test-runner
  #       spec:
  #         command: "go"
  #         args: ["run", "./cmd/go-lint-tags", "."]

  # Fast stub testenv for e2e testing (no real resources created)
  # The registry: every engine this repo's own stages name, run from this
  # checkout. forge://<name> consults these entries before falling through
  # to forge's own module, so a build here always runs the engine beside
  # it, with no environment variable saying so. A customer registers their
  # own engines the same way, in one place.
  - alias: container-build
    engine: ./cmd/container-build
  - alias: forge-dev
    engine: ./cmd/forge-dev
  - alias: forge-e2e
    engine: ./cmd/forge-e2e
  - alias: generic-test-runner
    engine: ./cmd/generic-test-runner
  - alias: go-build
    engine: ./cmd/go-build
  - alias: go-format
    engine: ./cmd/go-format
  - alias: go-gen-mocks
    engine: ./cmd/go-gen-mocks
  - alias: go-gen-openapi
    engine: ./cmd/go-gen-openapi
  - alias: go-lint
    engine: ./cmd/go-lint
  - alias: go-lint-licenses
    engine: ./cmd/go-lint-licenses
  - alias: go-lint-tags
    engine: ./cmd/go-lint-tags
  - alias: go-test
    engine: ./cmd/go-test
  - alias: parallel-builder
    engine: ./cmd/parallel-builder
  - alias: parallel-test-runner
    engine: ./cmd/parallel-test-runner
  - alias: test-report
    engine: ./cmd/test-report
  - alias: testenv-helm-install
    engine: ./cmd/testenv-helm-install
  - alias: testenv-kind
    engine: ./cmd/testenv-kind
  - alias: testenv-lcr
    engine: ./cmd/testenv-lcr
  - alias: testenv-stub
    engine: ./cmd/testenv-stub
  - alias: testenv
    engine: ./cmd/testenv
  - alias: go-dependency-detector
    engine: ./cmd/go-dependency-detector
  - alias: go-gen-mocks-dep-detector
    engine: ./cmd/go-gen-mocks-dep-detector
  - alias: go-gen-openapi-dep-detector
    engine: ./cmd/go-gen-openapi-dep-detector
  - alias: generic-builder
    engine: ./cmd/generic-builder
  - alias: go-gen-bpf
    engine: ./cmd/go-gen-bpf
  - alias: go-gen-protobuf
    engine: ./cmd/go-gen-protobuf
  - alias: container-build-simple
    engine: ./cmd/container-build-simple
  - alias: go-license-header
    engine: ./cmd/go-license-header
  - alias: rust-license-header
    engine: ./cmd/rust-license-header

  - alias: setup-e2e-stub
    type: testenv
    testenv:
      - engine: "forge://testenv-stub"

  - alias: setup-integration
    type: testenv
    testenv:
      - engine: "forge://testenv-kind"
      # spec:
      #   kubeconfigPath: .ignore.kindenv.kubeconfig.yaml
      #
      #   # -- envPropagation controls environment variable propagation (optional)
      #   # Environment variables are propagated automatically by default
      #   # envPropagation:
      #     # disabled: false           # Default: false (propagation enabled)
      #     # priority: 0               # Default: 65536 (lower number = higher priority)
      #     # whitelist: []             # Default: [] (all vars pass, mutually exclusive with blacklist)
      #     # blacklist: []             # Default: [] (all vars pass, mutually exclusive with whitelist)
      #     # envs:                     # Per-environment variable priority overrides
      #     #   KUBECONFIG:
      #     #     priority: 0           # Override priority for specific variable

      - # -- testenv-lcr creates, when enabled, a container registry in the
        #    cluster the entry before it stood up, using the kubeconfig that
        #    entry hands over. Everything it needs is on this spec.
        engine: "forge://testenv-lcr"
        spec:
          # -- enabled defines whether the local container registry must be created or not.
          enabled: true
          # -- images defines the list of images to push to the local container registry.
          # Use local:// prefix for locally built images (e.g., local://myapp:v1.0.0)
          # Use full registry path for remote images (e.g., quay.io/example/img:v1)
          images:
            # Minimal test image built by forge - much faster than pulling from remote
            - name: local://for-testing-purposes:latest
          # -- creadentialPath defines the output file containing the container registry credentials.
          # credentialPath: .ignore.local-container-registry.yaml
          # -- path to CA certificate.
          # caCrtPath: .ignore.ca.crt
          # -- namespace where the local container registry will be deployed.
          # namespace: local-container-registry
          # -- imagePullSecretNamespaces is a list of namespaces where image pull secrets should be automatically created.
          imagePullSecretNamespaces:
            - default
            - test-podinfo
            # -- imagePullSecretName is the name of the image pull secret to create (defaults to "local-container-registry-credentials").
            # imagePullSecretName: local-container-registry-credentials
          #
          # -- Example: Environment propagation with security filtering
          # envPropagation:
          #   blacklist:
          #     - REGISTRY_PASSWORD    # Don't propagate sensitive credentials
          #     - SECRET_TOKEN

      - # -- testenv-helm-install installs the charts declared here into the
        #    cluster the entry before it stood up. Every key it takes is in
        #    cmd/testenv-helm-install/spec.openapi.yaml and anything else is
        #    refused by name.
        engine: "forge://testenv-helm-install"
        spec:
          charts:
            - name: podinfo-release
              sourceType: helm-repo
              url: https://stefanprodan.github.io/podinfo
              chartName: podinfo
              namespace: test-podinfo
              releaseName: test-podinfo
              createNamespace: true
              timeout: "5m"
              disableWait: false

# -- test defines the test stages and their configuration
# The CLI as a first class run target. Every toolchain runnable declares
# forge-self-factory: the model has no exceptions.
run:
  - name: forge
    src: ./cmd/forge
    factory: git@github.com:alexandremahdhaoui/forge-self-factory.git

test:
  # -- lint-tags - verify all test files have build tags
  - name: lint-tags
    runner: "forge://go-lint-tags"
    # -- default value for setup is "forge://test-report"

  # -- lint-license - verify all Go files have license headers
  - name: lint-license
    runner: "forge://go-lint-licenses"

  # -- lint - linting as a test stage (no environment needed)
  - name: lint
    runner: "forge://go-lint"

  # -- unit tests - no environment management needed
  - name: unit
    runner: "forge://go-test"

  # The same tests as somebody who cannot write to /. Root hides a test that
  # names an absolute path and then creates it, which is how three defects
  # left a sibling repo green here and red on a colleague's machine.
  - name: unit-nonroot
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/unit-nonroot.sh"]

  # -- integration tests - creates isolated test environments
  - name: integration
    runner: "forge://go-test"
    testenv: "alias://setup-integration"
    # The fixture image the testenv pushes is this stage's to build: a bare
    # `forge build` leaves it alone (it wants a daemon), this stage builds it
    # before creating its environment, and nothing filters anything.
    needs: [for-testing-purposes]
    # spec:
    #   # -- Example: Test runner environment filtering (optional)
    #   # Control which environment variables from testenv are passed to tests
    #   # envPropagation:
    #     # whitelist:                # Only propagate these variables
    #     #   - KUBECONFIG
    #     #   - TESTENV_LCR_FQDN
    #     # blacklist:                # Propagate all except these (mutually exclusive with whitelist)
    #     #   - REGISTRY_PASSWORD
    #     #   - SECRET_TOKEN
    #     # disabled: false           # Set to true to disable all environment propagation to tests

  # -- e2e tests - comprehensive forge integration tests (no environment needed)
  - name: e2e
    runner: "forge://forge-e2e"

  # -- e2e-decl - declarative YAML-based e2e tests (test/e2e/testdata/)
  - name: e2e-decl
    runner: "forge://go-test"
    spec:
      tags:
        - e2e
      packages:
        - ./test/e2e/...
      timeout: "20m"
      args:
        - "-run"
        - "TestE2EDeclarative"

  # -- e2e-stub - lightweight testenv for fast e2e testing of create/list/get/delete workflow
  - name: e2e-stub
    runner: "forge://go-test"
    testenv: "alias://setup-e2e-stub"

  # -- e2e-run - the run system end to end: real git repos, a real factory,
  # a real register with provenance, real binaries. Needs the forge-factory
  # sibling checkout and no cluster.
  - name: e2e-run
    runner: "forge://go-test"
    spec:
      tags:
        - e2erun
      packages:
        - ./test/e2erun/...
      timeout: "20m"

# -- build defines the artifacts to build

  # Generated code is committed and read straight from the repo, and nothing
  # checked it against its source: the release gates on a -dirty revision, but
  # that revision is measured before any stage runs, so what a build
  # regenerates is invisible to it.
  - name: generated
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/generated-check.sh"]
